        // --- AUSGELAGERTE KOMPONENTEN ---
        const GlassCard = ({ children, className = '' }) => (

        const Toast = ({ message, type }) => {
            if (!message) return null;
            return (
                <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] animate-fade-in no-print">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md border text-sm font-bold flex items-center gap-2 ${type === 'error' ? 'bg-red-500/20 border-red-500/50 text-red-400' : 'bg-lime-500/20 border-lime-500/50 text-lime-400'}`}>

        };

        const PullToRefresh = ({ children, onRefresh }) => {
            const [pullDistance, setPullDistance] = useState(0);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const startY = useRef(0);

            const handleTouchStart = (e) => { if (window.scrollY === 0) startY.current = e.touches[0].clientY; };
            const handleTouchMove = (e) => {
                if (window.scrollY === 0 && startY.current > 0) {
                    const distance = e.touches[0].clientY - startY.current;
                    if (distance > 0) setPullDistance(Math.min(distance * 0.4, 80));
                }
            };
            const handleTouchEnd = async () => {
                if (pullDistance > 50) { setIsRefreshing(true); await onRefresh(); setIsRefreshing(false); }
                setPullDistance(0); startY.current = 0;
            };

            return (
                <div onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} style={{ transform: `translateY(${pullDistance}px)`, transition: pullDistance === 0 && !isRefreshing ? 'transform 0.3s ease' : 'none' }}>
                    <div className="absolute left-0 w-full flex justify-center items-center pointer-events-none" style={{ top: '-60px', height: '60px', opacity: pullDistance / 80 }}>
                        <RefreshCcw className={`text-lime-500 w-8 h-8 ${isRefreshing ? 'animate-spin' : ''}`} style={{ transform: `rotate(${pullDistance * 3}deg)` }} />
                    </div>
                    {children}
                </div>
            );
        };

        const Numpad = ({ pin, setPin, onSubmit }) => {
            const handleNum = (n) => { if (pin.length < 4) setPin(pin + n); };
            const handleDel = () => { setPin(pin.slice(0, -1)); };
            useEffect(() => { if (pin.length === 4) onSubmit(); }, [pin]);

            return (
                <div className="w-full max-w-[250px] mx-auto mt-6">
                    <div className="flex justify-center gap-4 mb-6">
                        {[0,1,2,3].map(i => <div key={i} className={`w-4 h-4 rounded-full transition-colors ${i < pin.length ? 'bg-lime-500 shadow-[0_0_10px_#84cc16]' : 'bg-white/10'}`}></div>)}
                    </div>
                    <div className="grid grid-cols-3 gap-4">
                        {[1,2,3,4,5,6,7,8,9].map(n => <button key={n} onClick={() => handleNum(n.toString())} className="h-16 rounded-full bg-white/5 hover:bg-white/10 text-2xl font-black text-white flex items-center justify-center transition active:scale-95">{n}</button>)}
                        <div className="h-16"></div>
                        <button onClick={() => handleNum('0')} className="h-16 rounded-full bg-white/5 hover:bg-white/10 text-2xl font-black text-white flex items-center justify-center transition active:scale-95">0</button>
                        <button onClick={handleDel} className="h-16 rounded-full bg-red-500/10 hover:bg-red-500/20 text-red-500 flex items-center justify-center transition active:scale-95"><Delete className="w-6 h-6"/></button>
                    </div>
                </div>
            )
        };

        const GroupedWorkoutList = ({ dailyWorkouts, customExercises, editingSetId, editData, setEditingSetId, setEditData, handleUpdateSet, handleDeleteSet, defaultExpanded = true }) => {
            const groupedExercises = useMemo(() => {
                const map = new Map();
                const keys = [];
                const sortedWorkouts = [...dailyWorkouts].reverse(); 

                sortedWorkouts.forEach(w => {
                    if (!map.has(w.exercise)) { map.set(w.exercise, []); keys.push(w.exercise); }
                    map.get(w.exercise).push(w);
                });
                
                return keys.map(k => ({ exercise: k, sets: map.get(k) })).reverse(); 
            }, [dailyWorkouts]);

            if (groupedExercises.length === 0) {
                return <p className="text-gray-500 text-center py-6 text-sm print-text-black">Kein Training an diesem Tag.</p>;
            }

            return (
                <div className="space-y-3">
                    {groupedExercises.map(group => (
                        <ExerciseGroup key={group.exercise} group={group} customExercises={customExercises} defaultExpanded={defaultExpanded}
                            editingSetId={editingSetId} editData={editData} setEditingSetId={setEditingSetId} 
                            setEditData={setEditData} handleUpdateSet={handleUpdateSet} handleDeleteSet={handleDeleteSet} 
                        />
                    ))}
                </div>
            );
        };

        const ExerciseGroup = ({ group, customExercises, defaultExpanded, editingSetId, editData, setEditingSetId, setEditData, handleUpdateSet, handleDeleteSet }) => {
            const [isExpanded, setIsExpanded] = useState(defaultExpanded);
            const maxWeight = Math.max(...group.sets.map(s => parseFloat(s.weight) || 0));

            return (
                <div className="bg-white/5 rounded-2xl border border-white/10 overflow-hidden print-card transition-all">
                    <button onClick={() => setIsExpanded(!isExpanded)} className="w-full flex justify-between items-center p-4 hover:bg-white/10 transition-colors">
                        <div className="text-left flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-black/40 border border-white/10 flex flex-col items-center justify-center print:hidden">
                                <span className="text-xs font-black text-lime-400">{group.sets.length}</span>
                                <span className="text-[8px] text-gray-500 uppercase font-bold -mt-1">Sets</span>
                            </div>
                            <div>
                                <div className="font-bold text-sm text-white print-text-black">{group.exercise}</div>
                                <div className="text-[10px] text-gray-400 print-text-black">Max: {maxWeight > 0 ? `${maxWeight} kg` : 'Bodyweight'}</div>
                            </div>
                        </div>
                        <div className="no-print">
                            {isExpanded ? <ChevronUp className="w-5 h-5 text-gray-400" /> : <ChevronDown className="w-5 h-5 text-gray-400" />}
                        </div>
                    </button>

                    {isExpanded && (
                        <div className="p-4 pt-0 border-t border-white/5 mt-2 bg-black/20">
                            <div className="relative pl-6 space-y-4 mt-4 timeline-line">
                                {group.sets.map((w, index) => {
                                    const isEditing = editingSetId === w.id;
                                    
                                    if (isEditing) {
                                        return (
                                            <div key={w.id} className="bg-lime-900/40 p-3 rounded-xl border border-lime-500/50 space-y-3 relative z-10 no-print ml-2">
                                                <div className="flex justify-between items-center text-[10px] text-lime-400 font-bold uppercase mb-2">
                                                    <span>Satz bearbeiten</span><button onClick={() => setEditingSetId(null)}><X className="w-4 h-4 text-gray-400 hover:text-white" /></button>
                                                </div>
                                                <select value={editData.exercise} onChange={e => setEditData({...editData, exercise: e.target.value})} className="w-full bg-black/60 text-white rounded-lg p-2 border border-white/20 outline-none text-sm">
                                                    {Object.entries(EXERCISES).map(([musGroup, list]) => {
                                                        const fullList = [...list, ...(customExercises[musGroup] || [])].sort();
                                                        return (
                                                            <optgroup key={musGroup} label={musGroup}>
                                                                {fullList.map(ex => <option key={ex} value={ex}>{ex}</option>)}
                                                            </optgroup>
                                                        )
                                                    })}
                                                </select>
                                                <div className="flex gap-2">
                                                    <div className="flex-1 relative">
                                                        <span className="absolute top-2.5 left-2 text-[10px] text-gray-500">KG</span>
                                                        <input type="number" value={editData.weight} onChange={e => setEditData({...editData, weight: e.target.value})} className="w-full bg-black/60 text-white rounded-lg p-2 pl-7 border border-white/20 outline-none text-sm font-bold" />
                                                    </div>
                                                    <div className="flex-1 relative">
                                                        <span className="absolute top-2.5 left-2 text-[10px] text-gray-500">Rep</span>
                                                        <input type="number" value={editData.reps} onChange={e => setEditData({...editData, reps: e.target.value})} className="w-full bg-black/60 text-white rounded-lg p-2 pl-8 border border-white/20 outline-none text-sm font-bold" />
                                                    </div>
                                                    <button onClick={handleUpdateSet} className="bg-lime-500 text-black p-2 rounded-lg font-bold hover:bg-lime-400 transition"><Save className="w-5 h-5" /></button>
                                                </div>
                                            </div>
                                        );
                                    }

                                    return (
                                        <div key={w.id} className="flex justify-between items-center group/set relative z-10 print-list-item py-1">
                                            <div className="flex items-center gap-3">
                                                <div className="absolute -left-7 w-2.5 h-2.5 rounded-full bg-lime-500 shadow-[0_0_8px_#84cc16] border border-[#050505] print:border-white print:shadow-none"></div>
                                                <div>
                                                    <div className="text-[11px] font-bold text-amber-400 print-text-black">{w.setType}</div>
                                                    <div className="text-[9px] text-gray-500 print-text-black">{w.timeString} {w.estimated1RM > 0 && `• 1RM: ${w.estimated1RM}kg`}</div>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <div className="font-bold text-white text-sm print-text-black">{w.weight}kg × {w.reps}</div>
                                                <div className="flex gap-1 opacity-0 group-hover/set:opacity-100 transition-opacity no-print">
                                                    <button onClick={() => { setEditingSetId(w.id); setEditData({exercise:w.exercise,weight:w.weight,reps:w.reps}); }} className="text-blue-400 hover:bg-blue-500/20 p-1.5 rounded"><Edit2 className="w-3.5 h-3.5" /></button>
                                                    <button onClick={() => handleDeleteSet(w.id)} className="text-red-500 hover:bg-red-500/20 p-1.5 rounded"><Trash2 className="w-3.5 h-3.5" /></button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}

                        </div>
                    )}

            );
        };


        // --- HAUPT APP KOMPONENTE ---
        function App() {
          const [activeTab, setActiveTab] = useState('eingabe'); 
          
          const [toast, setToast] = useState({ message: '', type: '' });
          const showToast = (msg, type = 'success') => {

              setTimeout(() => setToast({ message: '', type: '' }), 3000);

          const [dataLoading, setDataLoading] = useState(false);
          
          const [heatmapSettings, setHeatmapSettings] = useState({ exhausted: 24, recovering: 48 });
          const [isHeatmapModalOpen, setIsHeatmapModalOpen] = useState(false);
          
          // Custom Exercise Modal State
          const [customExModal, setCustomExModal] = useState({ isOpen: false, muscle: '' });

          const [muscle, setMuscle] = useState('');
          const [exercise, setExercise] = useState('');
          const [setType, setSetType] = useState('Arbeitssatz');
          const [weight, setWeight] = useState('');
          const [reps, setReps] = useState('');
          
          const [editingSetId, setEditingSetId] = useState(null);
          const [editData, setEditData] = useState({ exercise: '', weight: '', reps: '' });

          const [isRoutineModalOpen, setIsRoutineModalOpen] = useState(false);
          const [newRoutineName, setNewRoutineName] = useState('');
          const [newRoutineExercises, setNewRoutineExercises] = useState([]);
          
          const [isWorkoutActive, setIsWorkoutActive] = useState(false);
          const [workoutStartTime, setWorkoutStartTime] = useState(null);
          const [elapsedTime, setElapsedTime] = useState(0); 
          const [restDuration, setRestDuration] = useState(90);
          const [restTimeRemaining, setRestTimeRemaining] = useState(0);
          const [isRestTimerActive, setIsRestTimerActive] = useState(false);
          
          const [currentMonth, setCurrentMonth] = useState(new Date());
          const [selectedCalendarDate, setSelectedCalendarDate] = useState(new Date().toISOString().split('T')[0]);
          const [filterType, setFilterType] = useState('letzte_woche');
          const [customStart, setCustomStart] = useState('');
          const [customEnd, setCustomEnd] = useState('');
          const [bodyView, setBodyView] = useState('front');

          useEffect(() => {
            if (!auth) return;
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
              } catch (error) { 
                  showToast("Auth-Fehler: Anonyme Anmeldung aktivieren!", 'error'); 
                  setAuthLoading(false); 
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => setFirebaseUser(currentUser));
            return () => unsubscribe();
          }, []);

          useEffect(() => {
              if (!firebaseUser) return;
              const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'app_users');
              const unsub = onSnapshot(usersRef, (snap) => {
                  const fetchedUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  if (fetchedUsers.length === 0) {
                      addDoc(usersRef, { username: 'AYOUB', pin: '1991', role: 'admin' }).catch(e => console.error(e));
                  } else setAppUsers(fetchedUsers);
                  setAuthLoading(false);
              }, () => { setAuthLoading(false); });
              return () => unsub();
          }, [firebaseUser]);

          const loadPersonalData = async () => {
              if (!loggedInUser || !firebaseUser || !db) return;
              setDataLoading(true);
              const wRef = collection(db, 'artifacts', appId, 'users', loggedInUser.username, 'workouts');
              const sRef = collection(db, 'artifacts', appId, 'users', loggedInUser.username, 'standards');
              const prefRef = doc(db, 'artifacts', appId, 'users', loggedInUser.username, 'settings', 'preferences');
              const customExRef = doc(db, 'artifacts', appId, 'users', loggedInUser.username, 'settings', 'custom_exercises');
              
              const unsubW = onSnapshot(wRef, (snap) => {
                  const fetched = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  fetched.sort((a, b) => b.timestamp - a.timestamp); 
                  setWorkouts(fetched); setDataLoading(false);
              });
              const unsubS = onSnapshot(sRef, (snap) => setStandards(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
              const unsubPref = onSnapshot(prefRef, (docSnap) => {
                  if (docSnap.exists() && docSnap.data().heatmap) setHeatmapSettings(docSnap.data().heatmap);
              });
              const unsubCustomEx = onSnapshot(customExRef, (docSnap) => {
                  if (docSnap.exists()) setCustomExercises(docSnap.data().data || {});
              });

              return () => { unsubW(); unsubS(); unsubPref(); unsubCustomEx(); };
          };

          useEffect(() => {
              let cleanup;
              if (loggedInUser) loadPersonalData().then(c => cleanup = c);
              return () => { if (cleanup) cleanup(); };
          }, [loggedInUser]);

          const processLogin = () => {
              const u = appUsers.find(u => u.username.toUpperCase() === loginUsername.toUpperCase());
              if (!u) { showToast('Nutzer nicht gefunden', 'error'); setLoginPin(''); setLoginStep('username'); return; }
              if (u.pin !== loginPin) { showToast('Falscher PIN', 'error'); setLoginPin(''); return; }
              setLoggedInUser(u);
              showToast(`Willkommen, ${u.username}!`);
          };

          useEffect(() => {
            let interval;
            if (isWorkoutActive && workoutStartTime) interval = setInterval(() => setElapsedTime(Math.floor((Date.now() - workoutStartTime) / 1000)), 1000);
            return () => clearInterval(interval);
          }, [isWorkoutActive, workoutStartTime]);

          useEffect(() => {
              let interval;
              if (isRestTimerActive && restTimeRemaining > 0) interval = setInterval(() => setRestTimeRemaining(prev => prev - 1), 1000);
              else if (restTimeRemaining === 0 && isRestTimerActive) setIsRestTimerActive(false);
              return () => clearInterval(interval);
          }, [isRestTimerActive, restTimeRemaining]);

          const formatTime = (secs) => `${Math.floor(secs / 60)}:${(secs % 60).toString().padStart(2, '0')}`;

          const toggleWorkout = () => {
            if (isWorkoutActive) { setIsWorkoutActive(false); setRestTimeRemaining(0); setIsRestTimerActive(false); } 
            else { setWorkoutStartTime(Date.now()); setElapsedTime(0); setIsWorkoutActive(true); }
          };

          const calculate1RM = (w, r) => {
              const wNum = parseFloat(w), rNum = parseInt(r);
              if (!wNum || !rNum || rNum <= 0) return 0;
              if (rNum === 1) return wNum;
              return Math.round(wNum * (1 + (rNum / 30)));
          };

          const filteredWorkouts = useMemo(() => {
            const today = new Date(); today.setHours(23, 59, 59, 999);
            let startDate = new Date();
            if (filterType === 'letzte_woche') startDate.setDate(today.getDate() - 7);
            else if (filterType === 'letzter_monat') startDate.setMonth(today.getMonth() - 1);
            else if (filterType === 'letztes_jahr') startDate.setFullYear(today.getFullYear() - 1);
            else if (filterType === 'custom' && customStart && customEnd) {
              startDate = new Date(customStart);
              const end = new Date(customEnd); end.setHours(23, 59, 59, 999);
              return workouts.filter(w => new Date(w.date) >= startDate && new Date(w.date) <= end);
            }
            startDate.setHours(0, 0, 0, 0);
            return workouts.filter(w => new Date(w.date) >= startDate && new Date(w.date) <= today);
          }, [workouts, filterType, customStart, customEnd]);

          // --- CUSTOM EXERCISE HANDLERS ---
          const handleAddCustomExercise = async () => {
              if (!newCustomExName || !customExModal.muscle || !firebaseUser || !db) return;
              const updated = { ...customExercises };
              if (!updated[customExModal.muscle]) updated[customExModal.muscle] = [];
              if (updated[customExModal.muscle].includes(newCustomExName)) return showToast("Übung existiert bereits", "error");
              
              updated[customExModal.muscle].push(newCustomExName);
              try {
                  await setDoc(doc(db, 'artifacts', appId, 'users', loggedInUser.username, 'settings', 'custom_exercises'), { data: updated }, { merge: true });
                  setNewCustomExName('');
                  showToast("Eigene Übung hinzugefügt!");
              } catch (e) { showToast("Fehler beim Speichern", "error"); }
          };

          const handleDeleteCustomExercise = async (exName) => {
              if (!firebaseUser || !db) return;
              const updated = { ...customExercises };
              updated[customExModal.muscle] = updated[customExModal.muscle].filter(e => e !== exName);
              try {
                  await setDoc(doc(db, 'artifacts', appId, 'users', loggedInUser.username, 'settings', 'custom_exercises'), { data: updated }, { merge: true });

          };

          const handleSaveSet = async () => {
            if (!exercise || !reps || !firebaseUser || !db) return;
            let finalMuscle = muscle;
            if (selectedStandard) {
                for (const [group, exList] of Object.entries(EXERCISES)) { 
                    const fullList = [...exList, ...(customExercises[group]||[])];
                    if (fullList.includes(exercise)) { finalMuscle = group; break; } 
                }
            }
            const newSetData = {
              date, muscle: finalMuscle || 'Core', exercise, setType, weight: weight || '0', reps, estimated1RM: calculate1RM(weight, reps),
              timestamp: Date.now(), timeString: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };
            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', loggedInUser.username, 'workouts'), newSetData);
                showToast("Geloggt!"); setWeight(''); setReps(''); setRestTimeRemaining(restDuration); setIsRestTimerActive(true);
            } catch (error) { showToast("Speicherfehler", 'error'); }
          };

          const handleDeleteSet = async (id) => {
              if(!firebaseUser || !db) return;
              try { await deleteDoc(doc(db, 'artifacts', appId, 'users', loggedInUser.username, 'workouts', id)); showToast("Gelöscht"); } 
              catch (error) { showToast("Fehler", 'error'); }
          };

          const handleUpdateSet = async () => {
              if(!firebaseUser || !db || !editingSetId) return;
              try {
                  await updateDoc(doc(db, 'artifacts', appId, 'users', loggedInUser.username, 'workouts', editingSetId), {
                      exercise: editData.exercise, weight: editData.weight, reps: editData.reps, estimated1RM: calculate1RM(editData.weight, editData.reps)
                  });
                  setEditingSetId(null); showToast("Aktualisiert");
              } catch (error) { showToast("Fehler", 'error'); }
          };

          const saveHeatmapSettings = async () => {
              if(!firebaseUser || !db) return;
              try {
                  await setDoc(doc(db, 'artifacts', appId, 'users', loggedInUser.username, 'settings', 'preferences'), { heatmap: heatmapSettings }, { merge: true });
                  setIsHeatmapModalOpen(false); showToast("Zeiten gesichert!");

          if (authLoading) return <div className="min-h-screen flex items-center justify-center"><Loader2 className="w-10 h-10 text-lime-500 animate-spin" /></div>;

          if (!loggedInUser) {
              return (
                  <div className="min-h-screen flex flex-col items-center justify-center p-5 relative overflow-hidden">
                      <Toast message={toast.message} type={toast.type} />
                      <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-900/30 rounded-full blur-[100px] z-0"></div>
                      <GlassCard className="w-full max-w-sm relative z-10 !p-8 flex flex-col items-center text-center">
                          <BrandLogo />
                          <h1 className="text-4xl font-black text-white tracking-tight mt-4 mb-1">Lift<span className="text-lime-400">Pro</span></h1>
                          <span className="text-[18px] signature-font font-bold tracking-wide block mb-8" style={{ background: 'linear-gradient(to right, #a3e635, #3b82f6)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Made by Ayoub</span>
                          
                          {loginStep === 'username' ? (
                              <div className="w-full animate-fade-in">
                                  <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Benutzername</label>

                              </div>

                  </div>

                      setAdminNewUName(''); setAdminNewUPin(''); showToast("Nutzer angelegt!");

              const handleDeleteUser = async (id, name) => {

                              <input type="text" placeholder="Name" value={adminNewUName} onChange={e=>setAdminNewUName(e.target.value)} className="flex-2 bg-black/40 text-white rounded-lg p-3 border border-white/20 outline-none w-full uppercase" />

                          </div>
                          <button onClick={handleAddUser} className="w-full bg-blue-500 text-black font-bold p-3 rounded-lg flex items-center justify-center gap-2"><UserPlus className="w-4 h-4"/> Anlegen</button>
                      </GlassCard>
                      <GlassCard>
                          <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Aktive Nutzer ({appUsers.length})</h3>

                                      <div><div className="font-bold text-white">{u.username}</div><div className="text-[10px] text-gray-400 uppercase">{u.role}</div></div>
                                      <div className="flex items-center gap-4">
                                          <div className="text-xs font-bold text-gray-500 bg-black/50 px-2 py-1 rounded">PIN: {u.pin}</div>
                                          {u.username !== 'AYOUB' && <button onClick={() => handleDeleteUser(u.id, u.username)} className="text-red-500 p-2"><Trash2 className="w-4 h-4"/></button>}
                                      </div>
                                  </div>
                              ))}
                          </div>
                      </GlassCard>
                  </div>
              )
          };

          const renderTabEingabe = () => {
            const dailyWorkouts = workouts.filter(w => w.date === date);

            const isRestFinished = restTimeRemaining === 0 && !isRestTimerActive && dailyWorkouts.length > 0;

            const availableExercises = muscle ? [...(EXERCISES[muscle] || []), ...(customExercises[muscle] || [])].sort() : [];
            const standardRoutineExercises = selectedStandard ? standards.find(s=>s.id===selectedStandard)?.exercises : [];

            return (
              <PullToRefresh onRefresh={loadPersonalData}>
                  <div className="space-y-6 pb-32 animate-fade-in relative">

                        <div className="flex items-center gap-4 z-10">
                            <button onClick={toggleWorkout} className={`w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition-all ${isWorkoutActive ? 'bg-red-500/20 text-red-500 border border-red-500/50 hover:bg-red-500/30' : 'bg-lime-500 text-black hover:bg-lime-400'}`}>
                                {isWorkoutActive ? <StopCircle className="w-6 h-6" /> : <Play className="w-6 h-6 ml-1" />}
                            </button>
                            <div>
                                <h3 className="text-white font-bold text-lg">{isWorkoutActive ? formatTime(elapsedTime) : 'Workout'}</h3>
                                <p className="text-[10px] text-gray-400 uppercase tracking-wide">{isWorkoutActive ? 'Session aktiv' : 'Starten'}</p>
                            </div>
                        </div>
                        {isWorkoutActive && <div className="absolute -right-10 -top-10 w-32 h-32 bg-lime-500/10 rounded-full blur-2xl animate-pulse pointer-events-none"></div>}
                    </GlassCard>

                    <GlassCard className="space-y-5">
                      <input type="date" value={date} onChange={e => setDate(e.target.value)} className="bg-transparent text-white font-bold text-sm outline-none color-scheme-dark mb-2 block" />

                      <div className="flex items-center justify-between border-b border-white/10 pb-4">
                          <label className="text-sm font-bold text-white flex items-center gap-2"><Layers className="w-4 h-4 text-lime-400"/> Routine wählen</label>
                          {selectedStandard && <button onClick={() => {setSelectedStandard(''); setExercise('');}} className="text-[10px] bg-white/10 px-2 py-1 rounded-full text-gray-300">Freestyle</button>}
                      </div>

                      {!selectedStandard ? (
                        <div className="space-y-4 animate-fade-in">
                            <div className="flex overflow-x-auto gap-2 pb-2 hide-scrollbar">
                                {standards.map(s => <button key={s.id} onClick={() => {setSelectedStandard(s.id); setMuscle('');}} className="whitespace-nowrap px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm hover:bg-white/10 transition text-white">{s.name}</button>)}
                            </div>
                            <div className="space-y-2 pt-2">
                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider">Oder: Freestyle</label>
                                <div className="flex flex-wrap gap-2">
                                {MUSCLE_GROUPS.map(m => <button key={m} onClick={() => { setMuscle(m); setExercise(''); setSelectedStandard(''); }} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition border ${muscle === m ? 'bg-lime-500/20 border-lime-500/50 text-lime-400' : 'bg-transparent border-white/10 text-gray-400'}`}>{m}</button>)}
                                </div>
                            </div>
                            {muscle && (
                                <div className="space-y-2 animate-fade-in relative">
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider">Übung</label>
                                        <button onClick={() => setCustomExModal({ isOpen: true, muscle })} className="text-[10px] font-bold text-lime-400 bg-lime-500/10 px-2 py-1 rounded-full hover:bg-lime-500/20 transition">+ Eigene anlegen</button>
                                    </div>
                                    <select value={exercise} onChange={e => setExercise(e.target.value)} className="w-full bg-black/40 text-white rounded-xl p-3 border border-white/10 outline-none">
                                        <option value="">Wähle...</option>
                                        {availableExercises.map(ex => <option key={ex} value={ex}>{ex}</option>)}
                                    </select>
                                </div>
                            )}
                        </div>
                      ) : (
                         <div className="space-y-4 animate-fade-in">
                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider">Übung aus <span className="text-lime-400">{standards.find(s=>s.id===selectedStandard)?.name}</span></label>
                            <select value={exercise} onChange={e => setExercise(e.target.value)} className="w-full bg-black/40 text-white rounded-xl p-3 border border-white/10 outline-none">
                                <option value="">Wähle...</option>
                                {standardRoutineExercises.map(ex => <option key={ex} value={ex}>{ex}</option>)}
                            </select>
                        </div>
                      )}

                      {exercise && lastPerformance && (
                          <div className="bg-blue-500/10 border border-blue-500/30 rounded-xl p-3 flex items-start gap-3 animate-fade-in">
                              <Zap className="w-5 h-5 text-blue-400 flex-shrink-0 mt-0.5" />
                              <div>
                                  <h4 className="text-[10px] font-bold text-blue-400 uppercase tracking-wider mb-1">Ziel (Overload)</h4>
                                  <p className="text-xs text-blue-200">Letztes Mal: <strong className="text-white">{lastPerformance.weight}kg × {lastPerformance.reps}</strong></p>
                              </div>
                          </div>
                      )}

                      {exercise && (
                        <div className="pt-2 border-t border-white/10 animate-fade-in">
                          <div className="flex gap-2 overflow-x-auto hide-scrollbar mb-4">
                              {SET_TYPES.map(st => <button key={st} onClick={() => setSetType(st)} className={`whitespace-nowrap px-3 py-1 rounded-lg text-xs transition border ${setType === st ? 'bg-amber-500/20 border-amber-500/50 text-amber-400' : 'bg-transparent border-white/10 text-gray-400'}`}>{st}</button>)}
                          </div>
                          <div className="grid grid-cols-3 gap-3">
                            <div className="relative">
                              <span className="absolute top-2 left-3 text-[10px] text-gray-500 uppercase font-bold">KG</span>
                              <input type="number" value={weight} onChange={e => setWeight(e.target.value)} className="w-full bg-black/40 text-white rounded-xl p-3 pt-6 border border-white/10 outline-none text-xl font-bold text-center" />
                            </div>
                            <div className="relative">
                              <span className="absolute top-2 left-3 text-[10px] text-gray-500 uppercase font-bold">Reps</span>
                              <input type="number" value={reps} onChange={e => setReps(e.target.value)} className="w-full bg-black/40 text-white rounded-xl p-3 pt-6 border border-white/10 outline-none text-xl font-bold text-center" />
                            </div>
                            <button onClick={handleSaveSet} disabled={!exercise || !reps} className="bg-lime-500 hover:bg-lime-400 disabled:opacity-50 text-black font-bold rounded-xl shadow-[0_0_15px_rgba(132,204,22,0.3)] flex flex-col items-center justify-center transition-all active:scale-95">
                              <Check className="w-6 h-6" /><span className="text-[9px] uppercase tracking-wide opacity-80 mt-1">Loggen</span>
                            </button>
                          </div>
                        </div>
                      )}
                    </GlassCard>

                    {(isRestTimerActive || restTimeRemaining > 0 || isRestFinished) && (
                        <GlassCard className={`flex flex-col items-center transition-all duration-500 ${isRestFinished ? 'border-lime-500/50 bg-lime-500/10 shadow-[0_0_30px_rgba(132,204,22,0.2)]' : ''}`}>

                                <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2"><Clock className="w-4 h-4"/> Pausen-Manager</h3>
                                <div className="flex gap-2">
                                    {[60, 90, 120].map(secs => <button key={secs} onClick={() => { setRestDuration(secs); setRestTimeRemaining(secs); setIsRestTimerActive(true); }} className={`px-2 py-1 text-[10px] font-bold rounded-md border ${restDuration === secs ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-transparent text-gray-500 border-white/10 hover:text-white'}`}>{secs}s</button>)}
                                </div>
                            </div>
                            <div className="flex items-center gap-8 py-2">
                                <button onClick={() => { setRestTimeRemaining(restDuration); setIsRestTimerActive(false); }} className="p-3 bg-white/5 rounded-full hover:bg-white/10 text-gray-400 transition"><RotateCcw className="w-5 h-5" /></button>
                                <div className="relative flex items-center justify-center">
                                    <div className={`text-5xl font-black tabular-nums transition-colors ${isRestFinished ? 'text-lime-400 animate-pulse' : 'text-white'}`}>{formatTime(restTimeRemaining)}</div>

                                    {isRestTimerActive ? <Pause className="w-6 h-6" fill="currentColor"/> : <Play className="w-6 h-6 ml-1" fill="currentColor"/>}
                                </button>

                    )}

                    <div className="space-y-3">
                        <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-2">Training Heute</h3>
                        <GroupedWorkoutList 
                            dailyWorkouts={dailyWorkouts} customExercises={customExercises} defaultExpanded={true}
                            editingSetId={editingSetId} editData={editData} setEditingSetId={setEditingSetId} 
                            setEditData={setEditData} handleUpdateSet={handleUpdateSet} handleDeleteSet={handleDeleteSet} 
                        />
                    </div>
                  </div>
              </PullToRefresh>
            );
          };

          const renderTabHeatmap = () => {
              const getMuscleState = (muscleGrp) => {
                  const now = Date.now();
                  const recentWorkouts = workouts.filter(w => w.muscle === muscleGrp && (now - w.timestamp) <= (heatmapSettings.recovering + 24) * 3600 * 1000);
                  if (recentWorkouts.length === 0) return { fill: 'rgba(255,255,255,0.05)', stroke: 'rgba(255,255,255,0.2)', label: 'Erholt', hex: '#84cc16' }; 
                  const mostRecent = Math.max(...recentWorkouts.map(w => w.timestamp));
                  const hoursAgo = (now - mostRecent) / (1000 * 3600);
                  if (hoursAgo <= heatmapSettings.exhausted) return { fill: 'rgba(239,68,68,0.85)', stroke: '#fca5a5', label: `Erschöpft (${Math.round(hoursAgo)}h)`, hex: '#ef4444' };
                  if (hoursAgo <= heatmapSettings.recovering) return { fill: 'rgba(245,158,11,0.85)', stroke: '#fcd34d', label: `Regeneration (${Math.round(hoursAgo)}h)`, hex: '#f59e0b' };
                  return { fill: 'rgba(132,204,22,0.85)', stroke: '#bef264', label: `Erholt (${Math.round(hoursAgo)}h)`, hex: '#84cc16' };
              };
              const m = { brust: getMuscleState('Brust'), ruecken: getMuscleState('Rücken'), schultern: getMuscleState('Schultern'), arme: getMuscleState('Arme'), core: getMuscleState('Core'), beine: getMuscleState('Beine') };

              return (
                  <PullToRefresh onRefresh={loadPersonalData}>

                        {dates.length === 0 && <p className="text-gray-500 text-center py-8 text-sm print-text-black">Keine Historie gefunden.</p>}
                    </div>

                    <GlassCard className="print-card">
                        <h3 className="text-xs font-bold text-gray-400 mb-4 uppercase tracking-wider print-text-black">All-Time 1RM Rekorde</h3>
                        <div className="space-y-4">
                           {Object.keys(EXERCISES).map(muscleGroup => {
                               const groupWorkouts = workouts.filter(w => w.muscle === muscleGroup && w.estimated1RM > 0);
                               if (groupWorkouts.length === 0) return null;
                               const bestSet = groupWorkouts.reduce((prev, current) => (prev.estimated1RM > current.estimated1RM) ? prev : current);
                               return (
                                   <div key={muscleGroup} className="flex justify-between items-center border-b border-white/5 pb-2 last:border-0 print-list-item">
                                       <div>
                                           <div className="text-[10px] text-lime-400 font-bold uppercase print-text-black">{muscleGroup}</div>
                                           <div className="font-bold text-sm text-gray-100 print-text-black">{bestSet.exercise}</div>
                                       </div>
                                       <div className="text-right">
                                           <div className="font-black text-lg text-white print-text-black">{bestSet.estimated1RM} <span className="text-[10px] font-normal text-gray-400 print-text-black">kg (1RM)</span></div>
                                       </div>
                                   </div>
                               );
                           })}
                         </div>
                    </GlassCard>
                  </div>
              </PullToRefresh>
            );
          };

          return (
            <div className="min-h-screen font-sans selection:bg-lime-500/30 overflow-x-hidden pb-10">
              <Toast message={toast.message} type={toast.type} />
              
              <div className="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0 no-print">
                <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-900/20 rounded-full blur-[120px]"></div>
                <div className="absolute top-[40%] right-[-10%] w-[30%] h-[30%] bg-blue-900/10 rounded-full blur-[100px]"></div>
              </div>

              {/* GLOBAL CUSTOM EXERCISE MODAL (Über allen Tabs verfügbar) */}
              {customExModal.isOpen && (
                  <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                      <GlassCard className="w-full max-w-sm border-lime-500/50 shadow-[0_0_30px_rgba(132,204,22,0.2)] relative animate-fade-in">
                          <div className="flex justify-between items-center mb-4">
                              <h3 className="font-bold text-white text-lg">Übungen für {customExModal.muscle}</h3>
                              <button onClick={() => setCustomExModal({ isOpen: false, muscle: '' })}><X className="text-gray-400 hover:text-white"/></button>
                          </div>
                          <div className="flex gap-2 mb-6">
                              <input type="text" placeholder="Neue Übung..." value={newCustomExName} onChange={e=>setNewCustomExName(e.target.value)} className="flex-1 bg-black/40 text-white rounded-lg p-3 border border-white/20 outline-none text-sm" />
                              <button onClick={handleAddCustomExercise} className="bg-lime-500 text-black px-4 rounded-lg font-bold hover:bg-lime-400 transition"><Plus className="w-5 h-5"/></button>
                          </div>
                          <div className="space-y-2 max-h-48 overflow-y-auto hide-scrollbar">
                              <h4 className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Deine eigenen Übungen</h4>
                              {!(customExercises[customExModal.muscle]?.length > 0) && <p className="text-xs text-gray-500">Noch keine eigenen Übungen angelegt.</p>}
                              {(customExercises[customExModal.muscle] || []).map(ex => (
                                  <div key={ex} className="flex justify-between items-center bg-white/5 p-2 rounded-lg border border-white/10">
                                      <span className="text-sm text-gray-200">{ex}</span>
                                      <button onClick={() => handleDeleteCustomExercise(ex)} className="text-red-500 hover:text-red-400 p-1"><Trash2 className="w-4 h-4"/></button>
                                  </div>
                              ))}
                          </div>
                      </GlassCard>
                  </div>
              )}

              <header className="sticky top-0 z-20 px-5 py-4 bg-[#050505]/60 backdrop-blur-xl border-b border-white/5 no-print">
                <div className="flex items-center justify-between max-w-2xl mx-auto">
                  <div className="flex items-center gap-3">
                    <BrandLogo />
                    <div className="flex items-baseline gap-2">
                        <h1 className="text-2xl font-black text-white tracking-tight">Lift<span className="text-lime-400">Pro</span></h1>
                        <span className="text-[14px] signature-font font-bold tracking-wide" style={{ background: 'linear-gradient(to right, #a3e635, #3b82f6)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Made by Ayoub</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                      {isRestTimerActive && <div className="flex items-center gap-1 text-amber-500 text-[10px] font-bold uppercase animate-pulse"><Clock className="w-3 h-3" /> Pause</div>}
                      {isWorkoutActive && !isRestTimerActive && <div className="flex items-center gap-1 text-red-500 text-[10px] font-bold uppercase animate-pulse"><div className="w-2 h-2 bg-red-500 rounded-full"></div> Live</div>}
                  </div>
                </div>
              </header>

              <main className="p-5 max-w-2xl mx-auto relative z-10">
                {activeTab === 'eingabe' && renderTabEingabe()}
                {activeTab === 'heatmap' && renderTabHeatmap()}
                {activeTab === 'routinen' && renderTabRoutinen()}
                {activeTab === 'logbuch' && renderTabLogbuch()}
                {activeTab === 'stats' && renderTabStats()}
                {activeTab === 'admin' && renderTabAdmin()}
              </main>

              <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-[450px] z-50 no-print">
                <nav className="bg-black/80 backdrop-blur-3xl border border-white/10 rounded-full flex justify-between items-center px-3 py-2 shadow-2xl shadow-black/80">
                  <button onClick={() => setActiveTab('heatmap')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'heatmap' ? 'text-lime-400 bg-white/5' : 'text-gray-500 hover:text-gray-300'}`}><Activity className="w-5 h-5" /></button>
                  <button onClick={() => setActiveTab('routinen')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'routinen' ? 'text-lime-400 bg-white/5' : 'text-gray-500 hover:text-gray-300'}`}><Layers className="w-5 h-5" /></button>
                  <button onClick={() => setActiveTab('eingabe')} className="relative group mx-1">
                    <div className={`relative w-14 h-14 bg-lime-500 text-black rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(132,204,22,0.5)] transform transition-transform active:scale-95 border-2 border-black ${activeTab === 'eingabe' ? 'scale-110' : ''}`}><Plus className="w-6 h-6" /></div>
                  </button>
                  <button onClick={() => setActiveTab('logbuch')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'logbuch' ? 'text-lime-400 bg-white/5' : 'text-gray-500 hover:text-gray-300'}`}><CalendarIcon className="w-5 h-5" /></button>
                  <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'stats' ? 'text-lime-400 bg-white/5' : 'text-gray-500 hover:text-gray-300'}`}><BarChart2 className="w-5 h-5" /></button>
                  {loggedInUser.role === 'admin' && (
                      <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'admin' ? 'text-blue-400 bg-blue-500/10' : 'text-gray-500 hover:text-blue-300'}`}><Settings className="w-5 h-5" /></button>
                  )}
                </nav>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
