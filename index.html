        }

        @media print {
            body { background: white !important; color: black !important; }
            .no-print, .liquid-glass::before, .liquid-glass::after { display: none !important; }
            .print-container { padding: 0 !important; margin: 0 !important; }

            .print-card { background: transparent !important; border: 1px solid #ddd !important; box-shadow: none !important; break-inside: avoid; }
            .print-list-item { background: transparent !important; border-bottom: 1px solid #eee !important; border-radius: 0 !important; }

        }

        // --- KONSTANTEN ---

          'Rücken': ['Klimmzüge im Obergriff', 'Klimmzüge im Untergriff', 'Klimmzüge im Parallelgriff', 'Latziehen zur Brust (weiter Griff)', 'Latziehen zur Brust (enger Untergriff)', 'Latziehen im Neutralgriff', 'Latziehen mit gestreckten Armen', 'Vorgebeugtes Langhantel-Rudern (Obergriff)', 'Pendlay Row (Untergriff)', 'Einarmiges Kurzhantel-Rudern', 'T-Bar-Rudern', 'Rudern am Kabelzug (sitzend, eng)', 'Rudern am Kabelzug (weit)', 'Rudern am Kabelzug (mit Seil)', 'Maschinen-Rudern (brustgestützt, Obergriff)', 'Maschinen-Rudern (brustgestützt, Neutral)', 'Konventionelles Kreuzheben', 'Sumo-Kreuzheben', 'Rumänisches Kreuzheben (RDL)', 'Hyperextensions', 'Hyperextensions (Zusatzgewicht)', 'Good Mornings (Langhantel)', 'Schrägbank-Kurzhantel-Rudern', 'Meadows Row', 'Seal Row', 'Rack Pulls / Block Pulls', 'Face Pulls', 'Vorgebeugtes Seitheben (Kabelzug)', 'Einarmiges Latziehen', 'Pullover Maschine', 'Inverted Rows / Australian Pull-ups', 'Y-Raises', 'T-Raises', 'Einarmiges Rudern am Kabelzug (stehend)', 'Pendlay Row (explosiv)'],
          'Beine': ['Langhantel-Kniebeugen (Back Squat)', 'Frontkniebeugen', 'Goblet Squat', 'Hack Squat (Maschine)', '45-Grad-Beinpresse (mittig)', 'Beinpresse (Füße hoch)', 'Beinpresse (Füße tief)', 'Ausfallschritte nach vorne', 'Ausfallschritte nach hinten', 'Walking Lunges', 'Bulgarische Split Squats', 'Beinstrecker (Maschine)', 'Beinbeuger liegend (Maschine)', 'Beinbeuger sitzend (Maschine)', 'Beinbeuger stehend (einseitig)', 'Rumänisches Kreuzheben (Langhantel)', 'Rumänisches Kreuzheben (Kurzhanteln)', 'Hip Thrusts (Langhantel)', 'Hip Thrusts (Maschine)', 'Glute Bridges (Boden)', 'Einbeinige Glute Bridges', 'Wadenheben stehend (Maschine)', 'Wadenheben sitzend', 'Wadenheben an der Beinpresse', 'Einbeiniges Wadenheben', 'Sumo-Kniebeugen', 'Sissy Squats', 'Step-ups', 'Cossack Squats', 'Kettlebell Swings', 'Abduktoren-Maschine', 'Adduktoren-Maschine', 'Gestrecktes Kreuzheben', 'Box Squats', 'Bulgarian Split Squats (Smith-Machine)'],
          'Schultern': ['Schulterdrücken mit Langhantel', 'Schulterdrücken mit Kurzhanteln (sitzend)', 'Schulterdrücken mit Kurzhanteln (stehend)', 'Arnold Press', 'Seitheben mit Kurzhanteln (stehend)', 'Seitheben mit Kurzhanteln (sitzend)', 'Seitheben am Kabelzug', 'Seitheben an der Maschine', 'Frontheben mit Kurzhanteln', 'Plate Front Raise', 'Frontheben am Kabelzug', 'Rear Delt Flys (Kurzhanteln)', 'Vorgebeugtes Seitheben (Kabelzug)', 'Reverse Pec Deck (Maschine)', 'Face Pulls am Kabelzug (Seil)', 'Aufrechtes Rudern (Langhantel)', 'Aufrechtes Rudern (Kurzhanteln)', 'Aufrechtes Rudern (Kabelzug)', 'Push Press', 'Einarmige Landmine Press', 'Seated Shoulder Press Machine', 'Seated Dumbbell Clean and Press', 'High Pulls (Langhantel)', 'Y-Press', 'W-Press', 'Bradford Press', 'Cuban Press', 'Incline Lateral Raise', 'Einarmiges Seitheben in Seitenlage', 'Cable Upright Row (Seil)', 'Pike Push-ups', 'Handstand Push-ups', 'Scapular Push-ups', 'Z-Press', 'Overhead Squat'],
          'Arme': ['Langhantel-Bizepscurls', 'SZ-Stangen-Bizepscurls', 'Kurzhantel-Bizepscurls (stehend)', 'Kurzhantel-Bizepscurls (sitzend)', 'Hammercurls', 'Incline Dumbbell Curls', 'Konzentrationscurls', 'Curls am Kabelzug (Stange)', 'Curls am Kabelzug (Seil)', 'Scott-Curls / Preacher Curls', 'Preacher Curls (Maschine)', 'Konzentrationscurl (Kabelzug)', 'Spider Curls', 'Zottman Curls', 'Reverse Curls (Langhantel/SZ)', 'Reverse Curls (Kabelzug)', 'Drag Curls', 'Trizepsdrücken am Kabelzug (Seil)', 'Trizepsdrücken am Kabelzug (Stange/V-Griff)', 'Trizepsdrücken im Untergriff', 'Enges Bankdrücken', 'Skull Crushers (SZ-Stange)', 'Skull Crushers (Kurzhanteln)', 'Über-Kopf-Trizepsdrücken (Kurzhantel)', 'Über-Kopf-Trizepsdrücken (Kabelzug)', 'Trizeps-Kickbacks (Kurzhanteln)', 'Trizeps-Kickbacks (Kabelzug)', 'Dips (aufrecht/Trizeps)', 'Bankdips (Bench Dips)', 'Diamant-Liegestütz', 'Unterarm-Curls (Langhantel)', 'Reverse Unterarm-Curls (Langhantel)', 'Farmer\'s Walk', 'Handgripper', 'Plate Pinches'],
          'Core': ['Klassische Crunches', 'Crunches auf dem Gymnastikball', 'Kneeling Cable Crunch', 'Sit-ups', 'Decline Sit-ups', 'Hanging Leg Raises', 'Hanging Knee Raises', 'Flat Leg Raises', 'Reverse Curls (Beckenheben)', 'Plank', 'Side Plank', 'Dynamischer Unterarmstütz', 'Russian Twists', 'Bicycle Crunches', 'Mountain Climbers', 'Flutter Kicks', 'Hollow Body Hold', 'Dead Bug', 'Bird-Dog', 'Ab Wheel Rollouts', 'Windshield Wipers', 'V-Ups', 'Toe Touches', 'Holzhacker (Woodchoppers)', 'Pallof Press', 'Dragon Flags', 'L-Sit', 'Seitlicher Crunch', 'Seitliches Oberkörperheben', 'Standing Cable Crunch', 'Weighted Plank', 'Sit-up mit Kurzhantel', 'Scissor Kicks', 'Einseitiger Farmer\'s Walk', 'Pike Crunches']
        };
        const SET_TYPES = ['Arbeitssatz', 'Aufwärmsatz', 'Dropset', 'Top-Set'];

        // --- AUDIO ENGINE ---
        let audioCtx = null;
        const initAudio = () => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) { console.error("Audio Context Error", e); }
        };

        const trigger5SecAlarm = (vibrationEnabled, soundEnabled) => {
            if (vibrationEnabled && navigator.vibrate) {
                navigator.vibrate([500, 300, 500, 300, 500, 300, 500, 300, 500, 300, 500]);
            }
            if (soundEnabled) {
                try {
                    if (!audioCtx) initAudio();
                    const now = audioCtx.currentTime;
                    for(let i=0; i<5; i++) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, now + i); 
                        gain.gain.setValueAtTime(0, now + i);
                        gain.gain.linearRampToValueAtTime(1, now + i + 0.1);
                        gain.gain.linearRampToValueAtTime(0, now + i + 0.5);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(now + i); osc.stop(now + i + 0.6);
                    }
                } catch (e) { console.log("Audio blocked", e); }
            }
        };

        // --- AUSGELAGERTE KOMPONENTEN ---
        const GlassCard = ({ children, className = '' }) => (
            <div className={`liquid-glass rounded-[2rem] p-5 relative z-10 ${className}`}>{children}</div>
        );

        const BrandLogo = () => (
            <div className="w-10 h-10 rounded-full flex items-center justify-center overflow-hidden shadow-[0_0_15px_rgba(132,204,22,0.4)] border border-white/10 bg-black flex-shrink-0">
                <img src="Logo.PNG" alt="LiftPro Logo" className="w-full h-full object-cover" onError={(e) => { e.target.style.display = 'none'; e.target.parentNode.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M4 12h16M4 8v8M20 8v8M8 10v4M16 10v4"/></svg>`; }} />
            </div>
        );

        const Toast = ({ message, type }) => {
            if (!message) return null;
            return (
                <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] animate-fade-in no-print w-max max-w-[90vw]">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-3xl border text-sm font-bold flex items-center gap-2 ${type === 'error' ? 'bg-red-500/30 border-red-500/50 text-red-100' : 'bg-lime-500/30 border-lime-500/50 text-lime-100'}`}>
                        {type === 'error' ? <AlertCircle className="w-5 h-5 flex-shrink-0 text-red-400" /> : <Check className="w-5 h-5 flex-shrink-0 text-lime-400" />}
                        {message}
                    </div>
                </div>
            );
        };

        const PullToRefresh = ({ children, onRefresh }) => {
            const [pullDistance, setPullDistance] = useState(0);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const startY = useRef(0);

            const handleTouchStart = (e) => { if (window.scrollY === 0) startY.current = e.touches[0].clientY; };
            const handleTouchMove = (e) => {
                if (window.scrollY === 0 && startY.current > 0) {
                    const distance = e.touches[0].clientY - startY.current;
                    if (distance > 0) setPullDistance(Math.min(distance * 0.4, 80));
                }
            };
            const handleTouchEnd = async () => {
                if (pullDistance > 50) { setIsRefreshing(true); await onRefresh(); setIsRefreshing(false); }
                setPullDistance(0); startY.current = 0;
            };

            return (
                <div onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} style={{ transform: `translateY(${pullDistance}px)`, transition: pullDistance === 0 && !isRefreshing ? 'transform 0.3s ease' : 'none' }}>
                    <div className="absolute left-0 w-full flex justify-center items-center pointer-events-none" style={{ top: '-60px', height: '60px', opacity: pullDistance / 80 }}>
                        <RefreshCcw className={`text-lime-500 w-8 h-8 ${isRefreshing ? 'animate-spin' : ''}`} style={{ transform: `rotate(${pullDistance * 3}deg)` }} />
                    </div>
                    {children}
                </div>
            );
        };

        const Numpad = ({ pin, setPin, onSubmit }) => {
            const handleNum = (n) => { if (pin.length < 4) setPin(pin + n); };
            const handleDel = () => { setPin(pin.slice(0, -1)); };
            useEffect(() => { if (pin.length === 4) onSubmit(); }, [pin]);

            return (
                <div className="w-full max-w-[250px] mx-auto mt-6">
                    <div className="flex justify-center gap-4 mb-6">
                        {[0,1,2,3].map(i => <div key={i} className={`w-4 h-4 rounded-full transition-colors ${i < pin.length ? 'bg-lime-500 shadow-[0_0_10px_#84cc16]' : 'bg-white/10'}`}></div>)}
                    </div>
                    <div className="grid grid-cols-3 gap-4">
                        {[1,2,3,4,5,6,7,8,9].map(n => <button key={n} onClick={() => handleNum(n.toString())} className="h-16 rounded-full bg-white/5 hover:bg-white/10 text-2xl font-black text-white flex items-center justify-center transition active:scale-95">{n}</button>)}
                        <div className="h-16"></div>
                        <button onClick={() => handleNum('0')} className="h-16 rounded-full bg-white/5 hover:bg-white/10 text-2xl font-black text-white flex items-center justify-center transition active:scale-95">0</button>
                        <button onClick={handleDel} className="h-16 rounded-full bg-red-500/10 hover:bg-red-500/20 text-red-500 flex items-center justify-center transition active:scale-95"><Delete className="w-6 h-6"/></button>
                    </div>
                </div>
            )
        };

        const calculatePaceOrSpeed = (type, distanceKm, min, sec) => {
            const dist = parseFloat(distanceKm);
            const m = parseInt(min) || 0;
            const s = parseInt(sec) || 0;
            if (!dist || (m === 0 && s === 0)) return "-";
            
            const totalHours = (m + s/60) / 60;
            const totalMinutes = m + s/60;

            if (type.includes('Rad') || type.includes('Stairmaster')) {
                return `${(dist / totalHours).toFixed(1)} km/h`;
            } else {
                const paceMinDecimal = totalMinutes / dist;
                const paceMin = Math.floor(paceMinDecimal);
                const paceSec = Math.round((paceMinDecimal - paceMin) * 60);
                return `${paceMin}:${paceSec.toString().padStart(2, '0')} min/km`;
            }
        };

        // --- SMARTE GRUPPIERUNG DER ÜBUNGEN ---
        const GroupedWorkoutList = ({ dailyWorkouts, customExercises, editingSetId, editData, setEditingSetId, setEditData, handleUpdateSet, handleDeleteSet, defaultExpanded = true, canEdit }) => {
            const groupedExercises = useMemo(() => {
                const map = new Map();
                const keys = [];
                const sortedWorkouts = [...dailyWorkouts].reverse(); 

                sortedWorkouts.forEach(w => {
                    const key = w.trackingMode === 'cardio' ? w.cardioType : w.exercise;
                    if (!map.has(key)) { map.set(key, []); keys.push(key); }
                    map.get(key).push(w);
                });
                
                return keys.map(k => ({ exercise: k, sets: map.get(k) })).reverse(); 
            }, [dailyWorkouts]);

            if (groupedExercises.length === 0) return <p className="text-gray-500 text-center py-6 text-sm print-text-black">Kein Training an diesem Tag.</p>;

            return (
                <div className="space-y-4">
                    {groupedExercises.map(group => (
                        <ExerciseGroup key={group.exercise} group={group} customExercises={customExercises} defaultExpanded={defaultExpanded}
                            editingSetId={editingSetId} editData={editData} setEditingSetId={setEditingSetId} canEdit={canEdit}
                            setEditData={setEditData} handleUpdateSet={handleUpdateSet} handleDeleteSet={handleDeleteSet} 
                        />
                    ))}
                </div>
            );
        };

        const ExerciseGroup = ({ group, customExercises, defaultExpanded, editingSetId, editData, setEditingSetId, setEditData, handleUpdateSet, handleDeleteSet, canEdit }) => {
            const [isExpanded, setIsExpanded] = useState(defaultExpanded);
            const isCardio = group.sets[0].trackingMode === 'cardio';

            let groupSubText = "";
            if (isCardio) {
                const totalDist = group.sets.reduce((sum, s) => sum + (parseFloat(s.distance) || 0), 0);
                groupSubText = `Gesamt: ${totalDist.toFixed(2)} km`;
            } else {
                const maxWeight = Math.max(...group.sets.map(s => parseFloat(s.weight) || 0));
                groupSubText = `Max: ${maxWeight > 0 ? `${maxWeight} kg` : 'Bodyweight'}`;
            }

            return (
                <div className="liquid-glass rounded-3xl overflow-hidden print-card transition-all">
                    <button onClick={() => setIsExpanded(!isExpanded)} className="w-full flex justify-between items-center p-4 hover:bg-white/5 transition-colors">
                        <div className="text-left flex items-center gap-4">
                            <div className={`w-12 h-12 rounded-full border border-white/10 flex flex-col items-center justify-center print:hidden shadow-inner flex-shrink-0 ${isCardio ? 'bg-blue-500/20 text-blue-400' : 'bg-black/40 text-lime-400'}`}>
                                {isCardio ? <Activity className="w-5 h-5"/> : (
                                    <>
                                        <span className="text-[14px] font-black leading-none">{group.sets.length}</span>
                                        <span className="text-[8px] text-gray-400 uppercase font-bold mt-0.5">Sets</span>
                                    </>
                                )}
                            </div>
                            <div>
                                <div className="font-bold text-sm text-white print-text-black">{group.exercise}</div>
                                <div className="text-[10px] text-gray-400 print-text-black mt-0.5">{groupSubText}</div>
                            </div>
                        </div>
                        <div className="no-print">
                            {isExpanded ? <ChevronUp className="w-5 h-5 text-gray-400" /> : <ChevronDown className="w-5 h-5 text-gray-400" />}
                        </div>
                    </button>

                    {isExpanded && (
                        <div className="p-4 pt-0 border-t border-white/5 mt-2 bg-black/30">
                            <div className="relative pl-6 space-y-4 mt-4 timeline-line">
                                {group.sets.map((w, index) => {
                                    const isEditing = editingSetId === w.id;
                                    
                                    if (isEditing && canEdit) {
                                        if (w.trackingMode === 'cardio') {
                                            return (
                                                <div key={w.id} className="bg-blue-900/30 p-3 rounded-2xl border border-blue-500/40 space-y-3 relative z-10 no-print ml-2 shadow-lg backdrop-blur-md">
                                                    <div className="flex justify-between items-center text-[10px] text-blue-400 font-bold uppercase mb-2">
                                                        <span>Cardio bearbeiten</span><button onClick={() => setEditingSetId(null)}><X className="w-4 h-4 text-gray-400 hover:text-white" /></button>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <input type="number" step="0.1" value={editData.distance} onChange={e => setEditData({...editData, distance: e.target.value})} className="flex-1 bg-black/60 text-white rounded-lg p-2 border border-white/20 outline-none text-sm font-bold" placeholder="km" />
                                                        <input type="number" value={editData.durationMin} onChange={e => setEditData({...editData, durationMin: e.target.value})} className="w-16 bg-black/60 text-white rounded-lg p-2 border border-white/20 outline-none text-sm font-bold" placeholder="Min" />
                                                        <input type="number" value={editData.durationSec} onChange={e => setEditData({...editData, durationSec: e.target.value})} className="w-16 bg-black/60 text-white rounded-lg p-2 border border-white/20 outline-none text-sm font-bold" placeholder="Sek" />
                                                        <button onClick={handleUpdateSet} className="bg-blue-500 text-black p-2 rounded-lg font-bold hover:bg-blue-400 transition"><Save className="w-5 h-5" /></button>
                                                    </div>
                                                </div>
                                            )
                                        }

                                        return (
                                            <div key={w.id} className="bg-lime-900/30 p-3 rounded-2xl border border-lime-500/40 space-y-3 relative z-10 no-print ml-2 shadow-lg backdrop-blur-md">
                                                <div className="flex justify-between items-center text-[10px] text-lime-400 font-bold uppercase mb-2">
                                                    <span>Satz bearbeiten</span><button onClick={() => setEditingSetId(null)}><X className="w-4 h-4 text-gray-400 hover:text-white" /></button>
                                                </div>
                                                <select value={editData.exercise} onChange={e => setEditData({...editData, exercise: e.target.value})} className="w-full bg-black/60 text-white rounded-lg p-2 border border-white/20 outline-none text-sm">
                                                    {Object.entries(EXERCISES).map(([musGroup, list]) => {
                                                        const fullList = [...list, ...(customExercises[musGroup] || [])].sort();
                                                        return <optgroup key={musGroup} label={musGroup}>{fullList.map(ex => <option key={ex} value={ex}>{ex}</option>)}</optgroup>
                                                    })}
                                                </select>
                                                <div className="flex gap-2">
                                                    <div className="flex-1 relative">
                                                        <span className="absolute top-2.5 left-2 text-[10px] text-gray-500">KG</span>
                                                        <input type="number" value={editData.weight} onChange={e => setEditData({...editData, weight: e.target.value})} className="w-full bg-black/60 text-white rounded-lg p-2 pl-7 border border-white/20 outline-none text-sm font-bold" />
                                                    </div>
                                                    <div className="flex-1 relative">
                                                        <span className="absolute top-2.5 left-2 text-[10px] text-gray-500">Rep</span>
                                                        <input type="number" value={editData.reps} onChange={e => setEditData({...editData, reps: e.target.value})} className="w-full bg-black/60 text-white rounded-lg p-2 pl-8 border border-white/20 outline-none text-sm font-bold" />
                                                    </div>
                                                    <button onClick={handleUpdateSet} className="bg-lime-500 text-black p-2 rounded-lg font-bold hover:bg-lime-400 transition"><Save className="w-5 h-5" /></button>
                                                </div>
                                            </div>
                                        );
                                    }

                                    return (
                                        <div key={w.id} className="flex justify-between items-center group/set relative z-10 print-list-item py-1">
                                            <div className="flex items-center gap-4">
                                                <div className={`absolute -left-7 w-2.5 h-2.5 rounded-full shadow-[0_0_8px] border border-[#050505] print:border-white print:shadow-none ${isCardio ? 'bg-blue-500 shadow-blue-500/80' : 'bg-lime-500 shadow-lime-500/80'}`}></div>
                                                <div>
                                                    <div className={`text-[11px] font-bold print-text-black ${isCardio ? 'text-blue-400' : 'text-amber-400'}`}>
                                                        {isCardio ? `${w.durationMin || 0}m ${w.durationSec || 0}s` : w.setType}
                                                    </div>
                                                    <div className="text-[9px] text-gray-500 print-text-black">{w.timeString} {w.estimated1RM > 0 && `• 1RM: ${w.estimated1RM}kg`} {w.pace && `• Pace: ${w.pace}`}</div>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <div className="font-bold text-white text-sm print-text-black">
                                                    {isCardio ? `${w.distance} km` : `${w.weight}kg × ${w.reps}`}
                                                </div>
                                                {canEdit && (
                                                    <div className="flex gap-1 opacity-0 group-hover/set:opacity-100 transition-opacity no-print">
                                                        <button onClick={() => { 
                                                            setEditingSetId(w.id); 
                                                            if (isCardio) setEditData({ distance: w.distance, durationMin: w.durationMin, durationSec: w.durationSec });
                                                            else setEditData({exercise:w.exercise,weight:w.weight,reps:w.reps}); 
                                                        }} className="text-gray-400 hover:text-white p-1.5 rounded"><Edit2 className="w-3.5 h-3.5" /></button>
                                                        <button onClick={() => handleDeleteSet(w.id)} className="text-red-500 hover:text-red-400 p-1.5 rounded"><Trash2 className="w-3.5 h-3.5" /></button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        // --- HAUPT APP KOMPONENTE ---
        function App() {
          const [activeTab, setActiveTab] = useState('eingabe'); 
          
          const [toast, setToast] = useState({ message: '', type: '' });
          const showToast = (msg, type = 'success') => {
              setToast({ message: msg, type });
              setTimeout(() => setToast({ message: '', type: '' }), 3000);
          };

          const [firebaseUser, setFirebaseUser] = useState(null);
          const [appUsers, setAppUsers] = useState([]);
          const [loggedInUser, setLoggedInUser] = useState(null); 
          const [viewingUser, setViewingUser] = useState(null); 
          const [authLoading, setAuthLoading] = useState(true);
          const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
          
          const [userSettings, setUserSettings] = useState({ sound: true, vibration: true });

          const [loginStep, setLoginStep] = useState('username'); 
          const [loginUsername, setLoginUsername] = useState('');
          const [loginPin, setLoginPin] = useState('');
          const [regUsername, setRegUsername] = useState('');
          const [regPin, setRegPin] = useState('');

          const [adminEditUserId, setAdminEditUserId] = useState(null);
          const [adminEditData, setAdminEditData] = useState({ username: '', pin: '' });
          const [adminNewUName, setAdminNewUName] = useState('');
          const [adminNewUPin, setAdminNewUPin] = useState('');

          const [workouts, setWorkouts] = useState([]);
          const [standards, setStandards] = useState([]);
          const [customExercises, setCustomExercises] = useState({}); 
          const [dataLoading, setDataLoading] = useState(false);
          
          const [heatmapSettings, setHeatmapSettings] = useState({ exhausted: 24, recovering: 48 });
          const [isHeatmapModalOpen, setIsHeatmapModalOpen] = useState(false);
          const [customExModal, setCustomExModal] = useState({ isOpen: false, muscle: '' });
          const [newCustomExName, setNewCustomExName] = useState('');

          const [trackingMode, setTrackingMode] = useState('kraft');
          const [selectedStandard, setSelectedStandard] = useState('');
          const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
          
          const [muscle, setMuscle] = useState('');
          const [exercise, setExercise] = useState('');
          const [setType, setSetType] = useState('Arbeitssatz');
          const [weight, setWeight] = useState('');
          const [reps, setReps] = useState('');
          
          const [cardioType, setCardioType] = useState('Laufen (Joggen)');
          const [cardioDist, setCardioDist] = useState('');
          const [cardioMin, setCardioMin] = useState('');
          const [cardioSec, setCardioSec] = useState('');

          const [editingSetId, setEditingSetId] = useState(null);
          const [editData, setEditData] = useState({ exercise: '', weight: '', reps: '', distance: '', durationMin: '', durationSec: '' });

          const [isRoutineModalOpen, setIsRoutineModalOpen] = useState(false);
          const [newRoutineName, setNewRoutineName] = useState('');
          const [newRoutineExercises, setNewRoutineExercises] = useState([]);
          
          const [isWorkoutActive, setIsWorkoutActive] = useState(false);
          const [workoutStartTime, setWorkoutStartTime] = useState(null);
          const [elapsedTime, setElapsedTime] = useState(0); 
          const [restDuration, setRestDuration] = useState(90);
          const [restEndTime, setRestEndTime] = useState(null);
          const [restTimeRemaining, setRestTimeRemaining] = useState(0);
          const [isRestTimerActive, setIsRestTimerActive] = useState(false);
          
          const [currentMonth, setCurrentMonth] = useState(new Date());
          const [selectedCalendarDate, setSelectedCalendarDate] = useState(new Date().toISOString().split('T')[0]);
          const [filterType, setFilterType] = useState('letzte_woche');
          const [customStart, setCustomStart] = useState('');
          const [customEnd, setCustomEnd] = useState('');
          const [bodyView, setBodyView] = useState('front');

          useEffect(() => {
            if (!auth) return;
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
              } catch (error) { 
                  showToast("Auth-Fehler. Anonyme Anmeldung prüfen!", 'error'); 
                  setAuthLoading(false); 
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => setFirebaseUser(currentUser));
            return () => unsubscribe();
          }, []);

          useEffect(() => {
              if (!firebaseUser) return;
              const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'app_users');
              const unsub = onSnapshot(usersRef, (snap) => {
                  const fetchedUsers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  if (fetchedUsers.length === 0) {
                      addDoc(usersRef, { username: 'AYOUB', pin: '1991', role: 'admin', lastActive: Date.now(), isBanned: false, isPrivate: false }).catch(e => console.error(e));
                  } else setAppUsers(fetchedUsers);
                  setAuthLoading(false);
              }, () => { setAuthLoading(false); });
              return () => unsub();
          }, [firebaseUser]);

          // --- ONLINE STATUS PULSE ---
          useEffect(() => {
              if (!loggedInUser || !firebaseUser || !db) return;
              const interval = setInterval(() => {
                  updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', loggedInUser.id), { lastActive: Date.now() }).catch(()=>{});
              }, 60000);
              updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', loggedInUser.id), { lastActive: Date.now() }).catch(()=>{});
              return () => clearInterval(interval);
          }, [loggedInUser, firebaseUser]);


          const loadPersonalData = async () => {
              if (!viewingUser || !firebaseUser || !db) return;
              setDataLoading(true);
              const wRef = collection(db, 'artifacts', appId, 'users', viewingUser.username, 'workouts');
              const sRef = collection(db, 'artifacts', appId, 'users', viewingUser.username, 'standards');
              const prefRef = doc(db, 'artifacts', appId, 'users', viewingUser.username, 'settings', 'preferences');
              const customExRef = doc(db, 'artifacts', appId, 'users', viewingUser.username, 'settings', 'custom_exercises');
              
              const unsubW = onSnapshot(wRef, (snap) => {
                  const fetched = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  fetched.sort((a, b) => b.timestamp - a.timestamp); 
                  setWorkouts(fetched); setDataLoading(false);
              });
              const unsubS = onSnapshot(sRef, (snap) => setStandards(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
              const unsubPref = onSnapshot(prefRef, (docSnap) => {
                  if (docSnap.exists()) {
                      const d = docSnap.data();
                      if (d.heatmap) setHeatmapSettings(d.heatmap);
                      if (d.settings && viewingUser.username === loggedInUser.username) setUserSettings(d.settings);
                  }
              });
              const unsubCustomEx = onSnapshot(customExRef, (docSnap) => {
                  if (docSnap.exists()) setCustomExercises(docSnap.data().data || {});
                  else setCustomExercises({});
              });

              return () => { unsubW(); unsubS(); unsubPref(); unsubCustomEx(); };
          };

          useEffect(() => {
              let cleanup;
              if (viewingUser) loadPersonalData().then(c => cleanup = c);
              return () => { if (cleanup) cleanup(); };
          }, [viewingUser]);

          // --- AUTH LOGIC ---
          const processLogin = () => {
              const u = appUsers.find(u => u.username.toUpperCase() === loginUsername.toUpperCase());
              if (!u) { showToast('Nutzer nicht gefunden', 'error'); setLoginPin(''); setLoginStep('username'); return; }
              if (u.isBanned) { showToast('Konto wurde vom Admin gesperrt!', 'error'); setLoginPin(''); setLoginStep('username'); return; }
              
              // Fallback für Admin AYOUB, falls Firebase noch den alten 0000 Pin gespeichert hat
              if (u.username === 'AYOUB' && loginPin === '1991' && u.pin !== '1991') {
                  updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', u.id), { pin: '1991' }).catch(()=>{});
                  u.pin = '1991'; 
              }

              if (u.pin !== loginPin) { showToast('Falscher PIN', 'error'); setLoginPin(''); return; }
              
              setLoggedInUser(u);
              setViewingUser(u); 
              setIsProfileModalOpen(false); 
              showToast(`Willkommen, ${u.username}!`);
          };

          const handleRegister = async () => {
              if (!regUsername || regPin.length !== 4) return showToast("Name & 4-stelliger PIN benötigt", "error");
              if (appUsers.some(u => u.username.toUpperCase() === regUsername.toUpperCase())) return showToast("Benutzername vergeben", "error");
              try {
                  const newUser = { username: regUsername.toUpperCase(), pin: regPin, role: 'user', lastActive: Date.now(), isBanned: false, isPrivate: false };
                  const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'app_users'), newUser);
                  const u = { id: docRef.id, ...newUser };
                  setLoggedInUser(u);
                  setViewingUser(u);
                  setIsProfileModalOpen(false); 
                  showToast("Konto erfolgreich erstellt!");
              } catch(e) { showToast("Registrierung fehlgeschlagen", "error"); }
          };

          const handleLogout = () => {
              setLoggedInUser(null); setViewingUser(null); setIsProfileModalOpen(false);
              setLoginStep('username'); setLoginUsername(''); setLoginPin('');
              showToast("Erfolgreich abgemeldet");
          };

          // --- ROBUSTE HINTERGRUND-TIMERS ---
          useEffect(() => {
            let interval;
            if (isWorkoutActive && workoutStartTime) {
                interval = setInterval(() => setElapsedTime(Math.floor((Date.now() - workoutStartTime) / 1000)), 500);
            }
            return () => clearInterval(interval);
          }, [isWorkoutActive, workoutStartTime]);

          useEffect(() => {
              let interval;
              if (isRestTimerActive && restEndTime) {
                  interval = setInterval(() => {
                      const remain = Math.max(0, Math.ceil((restEndTime - Date.now()) / 1000));
                      setRestTimeRemaining(remain);
                      if (remain === 0) {
                          setIsRestTimerActive(false);
                          trigger5SecAlarm(userSettings.vibration, userSettings.sound);
                      }
                  }, 250); 
              }
              return () => clearInterval(interval);
          }, [isRestTimerActive, restEndTime, userSettings]);

          const startRestTimer = (secs) => {
              initAudio(); 
              setRestDuration(secs);
              setRestTimeRemaining(secs);
              setRestEndTime(Date.now() + secs * 1000);
              setIsRestTimerActive(true);
          };

          const formatWorkoutTime = (secs) => {
              const h = Math.floor(secs / 3600);
              const m = Math.floor((secs % 3600) / 60);
              const s = secs % 60;
              if (h > 0) return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
              return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
          };

          const formatRestTime = (secs) => {
              const m = Math.floor(secs / 60);
              const s = secs % 60;
              return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
          };

          const toggleWorkout = () => {
            if (isWorkoutActive) { setIsWorkoutActive(false); setRestTimeRemaining(0); setIsRestTimerActive(false); setRestEndTime(null); } 
            else { setWorkoutStartTime(Date.now() - elapsedTime * 1000); setIsWorkoutActive(true); }
          };

          const calculate1RM = (w, r) => {
              const wNum = parseFloat(w), rNum = parseInt(r);
              if (!wNum || !rNum || rNum <= 0) return 0;
              if (rNum === 1) return wNum;
              return Math.round(wNum * (1 + (rNum / 30)));
          };

          const canEdit = loggedInUser && viewingUser && (loggedInUser.role === 'admin' || loggedInUser.username === viewingUser.username);

          const filteredWorkouts = useMemo(() => {
            const today = new Date(); today.setHours(23, 59, 59, 999);
            let startDate = new Date();
            if (filterType === 'letzte_woche') startDate.setDate(today.getDate() - 7);
            else if (filterType === 'letzter_monat') startDate.setMonth(today.getMonth() - 1);
            else if (filterType === 'letztes_jahr') startDate.setFullYear(today.getFullYear() - 1);
            else if (filterType === 'custom' && customStart && customEnd) {
              startDate = new Date(customStart);
              const end = new Date(customEnd); end.setHours(23, 59, 59, 999);
              return workouts.filter(w => new Date(w.date) >= startDate && new Date(w.date) <= end);
            }
            startDate.setHours(0, 0, 0, 0);
            return workouts.filter(w => new Date(w.date) >= startDate && new Date(w.date) <= today);
          }, [workouts, filterType, customStart, customEnd]);

          // --- HANDLERS ---
          const saveUserSettings = async (newSettings) => {
              const updated = { ...userSettings, ...newSettings };
              setUserSettings(updated);
              if (firebaseUser && db) {
                  await setDoc(doc(db, 'artifacts', appId, 'users', loggedInUser.username, 'settings', 'preferences'), { settings: updated }, { merge: true });
              }
          };

          const togglePrivacy = async (isPrivate) => {
              if(!firebaseUser || !db || !loggedInUser) return;
              try {
                  await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', loggedInUser.id), { isPrivate });
                  setLoggedInUser({...loggedInUser, isPrivate});
                  if(loggedInUser.id === viewingUser.id) setViewingUser({...viewingUser, isPrivate});
                  showToast(isPrivate ? "Profil versteckt" : "Profil öffentlich");
              } catch(e) { showToast("Fehler", "error"); }
          };

          const handleAddCustomExercise = async () => {
              if (!newCustomExName || !customExModal.muscle || !firebaseUser || !db) return;
              if (!canEdit) return showToast("Keine Berechtigung", "error");
              const updated = { ...customExercises };
              if (!updated[customExModal.muscle]) updated[customExModal.muscle] = [];
              if (updated[customExModal.muscle].includes(newCustomExName)) return showToast("Existiert bereits", "error");
              
              updated[customExModal.muscle].push(newCustomExName);
              try {
                  await setDoc(doc(db, 'artifacts', appId, 'users', viewingUser.username, 'settings', 'custom_exercises'), { data: updated }, { merge: true });
                  setNewCustomExName(''); showToast("Eigene Übung hinzugefügt!");
              } catch (e) { showToast("Fehler beim Speichern", "error"); }
          };

          const handleDeleteCustomExercise = async (exName) => {
              if (!firebaseUser || !db || !canEdit) return;
              const updated = { ...customExercises };
              updated[customExModal.muscle] = updated[customExModal.muscle].filter(e => e !== exName);
              try {
                  await setDoc(doc(db, 'artifacts', appId, 'users', viewingUser.username, 'settings', 'custom_exercises'), { data: updated }, { merge: true });
                  showToast("Übung entfernt");
              } catch (e) { showToast("Fehler", "error"); }
          };

          const handleSaveSet = async () => {
            if (!firebaseUser || !db || !canEdit) return;
            
            initAudio(); 
            
            let newSetData = {
                date, trackingMode, timestamp: Date.now(), timeString: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            if (trackingMode === 'kraft') {
                if (!exercise || !reps) return;
                let finalMuscle = muscle;
                if (selectedStandard) {
                    for (const [group, exList] of Object.entries(EXERCISES)) { 
                        const fullList = [...exList, ...(customExercises[group]||[])];
                        if (fullList.includes(exercise)) { finalMuscle = group; break; } 
                    }
                }
                newSetData = { ...newSetData, muscle: finalMuscle || 'Core', exercise, setType, weight: weight || '0', reps, estimated1RM: calculate1RM(weight, reps) };
            } else {
                if (!cardioDist && (!cardioMin && !cardioSec)) return;
                newSetData = { ...newSetData, muscle: 'Cardio', cardioType, exercise: cardioType, distance: cardioDist || '0', durationMin: cardioMin || '0', durationSec: cardioSec || '0', pace: calculatePaceOrSpeed(cardioType, cardioDist, cardioMin, cardioSec) };
            }

            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', viewingUser.username, 'workouts'), newSetData);
                showToast("Geloggt!"); 
                if(trackingMode === 'kraft') { setWeight(''); setReps(''); startRestTimer(restDuration); }
                else { setCardioDist(''); setCardioMin(''); setCardioSec(''); }
            } catch (error) { showToast("Speicherfehler", 'error'); }
          };

          const handleDeleteSet = async (id) => {
              if(!firebaseUser || !db || !canEdit) return;
              try { await deleteDoc(doc(db, 'artifacts', appId, 'users', viewingUser.username, 'workouts', id)); showToast("Gelöscht"); } 
              catch (error) { showToast("Fehler", 'error'); }
          };

          const handleUpdateSet = async () => {
              if(!firebaseUser || !db || !editingSetId || !canEdit) return;
              try {
                  const toUpdate = editData.distance !== undefined ? 
                      { distance: editData.distance, durationMin: editData.durationMin, durationSec: editData.durationSec, pace: calculatePaceOrSpeed('Cardio', editData.distance, editData.durationMin, editData.durationSec) } :
                      { exercise: editData.exercise, weight: editData.weight, reps: editData.reps, estimated1RM: calculate1RM(editData.weight, editData.reps) };
                  
                  await updateDoc(doc(db, 'artifacts', appId, 'users', viewingUser.username, 'workouts', editingSetId), toUpdate);
                  setEditingSetId(null); showToast("Aktualisiert");
              } catch (error) { showToast("Fehler", 'error'); }
          };

          const saveHeatmapSettings = async () => {
              if(!firebaseUser || !db || !canEdit) return;
              try {
                  await setDoc(doc(db, 'artifacts', appId, 'users', viewingUser.username, 'settings', 'preferences'), { heatmap: heatmapSettings }, { merge: true });
                  setIsHeatmapModalOpen(false); showToast("Zeiten gesichert!");
              } catch (e) { showToast("Fehler", "error"); }
          };

          const handleCopyRoutine = async (routineToCopy) => {
              if(!firebaseUser || !db || !loggedInUser) return;
              try {
                  await addDoc(collection(db, 'artifacts', appId, 'users', loggedInUser.username, 'standards'), { 
                      name: `${routineToCopy.name} (von ${viewingUser.username})`, 
                      exercises: routineToCopy.exercises 
                  });
                  showToast(`Routine erfolgreich kopiert!`);
              } catch(e) { showToast("Fehler beim Kopieren", "error"); }
          };

          // --- VIEWS ---
          if (authLoading) return <div className="min-h-screen flex items-center justify-center"><Loader2 className="w-10 h-10 text-lime-500 animate-spin" /></div>;

          if (!loggedInUser) {
              return (
                  <div className="min-h-screen flex flex-col items-center justify-center p-5 relative overflow-hidden">
                      <Toast message={toast.message} type={toast.type} />
                      <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-900/30 rounded-full blur-[100px] z-0"></div>
                      <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-900/20 rounded-full blur-[100px] z-0"></div>
                      
                      <GlassCard className="w-full max-w-sm relative z-10 !p-8 flex flex-col items-center text-center backdrop-blur-3xl">
                          <BrandLogo />
                          <h1 className="text-4xl font-black text-white tracking-tight mt-4 mb-1">Lift<span className="text-lime-400">Pro</span></h1>
                          <span className="text-[18px] signature-font font-bold tracking-wide block mb-8" style={{ background: 'linear-gradient(to right, #a3e635, #3b82f6)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Made by Ayoub</span>
                          
                          {loginStep === 'username' ? (
                              <div className="w-full animate-fade-in">

                      </div>
                      
                      {filterType === 'custom' && (
                        <GlassCard className="flex gap-4 !p-3 animate-fade-in">
                          <div className="flex-1"><label className="block text-[9px] text-gray-500 uppercase">Start</label><input type="date" value={customStart} onChange={e=>setCustomStart(e.target.value)} className="w-full bg-transparent text-sm text-white outline-none color-scheme-dark" /></div>
                          <div className="flex-1 border-l border-white/10 pl-4"><label className="block text-[9px] text-gray-500 uppercase">Ende</label><input type="date" value={customEnd} onChange={e=>setCustomEnd(e.target.value)} className="w-full bg-transparent text-sm text-white outline-none color-scheme-dark" /></div>
                        </GlassCard>
                      )}
                    </div>

                    <div className="hidden print-block text-black mb-8 border-b-2 border-black pb-4">
                      <h1 className="text-3xl font-black">LiftPro Report</h1>
                      <p className="text-sm">Erstellt am: {new Date().toLocaleDateString('de-DE')}</p>
                      <p className="text-sm">Nutzer: {viewingUser?.username}</p>
                      <p className="text-sm">Zeitraum: {filterType === 'custom' ? `${customStart} bis ${customEnd}` : filterType.replace('_', ' ').toUpperCase()}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <GlassCard className="flex flex-col items-center justify-center text-center !p-4 print-card relative overflow-hidden">
                        <div className="absolute -bottom-4 -right-4 w-16 h-16 bg-lime-500/20 rounded-full blur-xl no-print"></div>
                        <Activity className="w-6 h-6 text-lime-400 mb-2 print-text-black" />
                        <div className="text-2xl font-black text-white print-text-black">{filteredWorkouts.length}</div>
                        <div className="text-[10px] text-gray-400 uppercase font-bold print-text-black">Absolvierte Sätze</div>
                      </GlassCard>
                      <GlassCard className="flex flex-col items-center justify-center text-center !p-4 print-card relative overflow-hidden">
                        <div className="absolute -top-4 -left-4 w-16 h-16 bg-amber-500/20 rounded-full blur-xl no-print"></div>
                        <Dumbbell className="w-6 h-6 text-amber-400 mb-2 print-text-black" />
                        <div className="text-2xl font-black text-white print-text-black">{totalVolume} <span className="text-sm">kg</span></div>
                        <div className="text-[10px] text-gray-400 uppercase font-bold print-text-black">Volumen (Zeitraum)</div>
                      </GlassCard>
                    </div>

                    <div className="space-y-6">
                        {dates.map(dateStr => (
                            <div key={dateStr}>
                                <h3 className="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider print-text-black">{new Date(dateStr).toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'long'})}</h3>
                                <GroupedWorkoutList 
                                    dailyWorkouts={dateMap.get(dateStr)} customExercises={customExercises} defaultExpanded={false} canEdit={canEdit}
                                    editingSetId={editingSetId} editData={editData} setEditingSetId={setEditingSetId} 
                                    setEditData={setEditData} handleUpdateSet={handleUpdateSet} handleDeleteSet={handleDeleteSet} 
                                />
                            </div>
                        ))}
                        {dates.length === 0 && <p className="text-gray-500 text-center py-8 text-sm print-text-black">Keine Historie gefunden.</p>}
                    </div>

                    <GlassCard className="print-card">
                        <h3 className="text-xs font-bold text-gray-400 mb-4 uppercase tracking-wider print-text-black">All-Time 1RM Rekorde</h3>
                        <div className="space-y-4">
                           {Object.keys(EXERCISES).map(muscleGroup => {
                               const groupWorkouts = workouts.filter(w => w.muscle === muscleGroup && w.estimated1RM > 0);
                               if (groupWorkouts.length === 0) return null;
                               const bestSet = groupWorkouts.reduce((prev, current) => (prev.estimated1RM > current.estimated1RM) ? prev : current);
                               return (
                                   <div key={muscleGroup} className="flex justify-between items-center border-b border-white/5 pb-2 last:border-0 print-list-item">
                                       <div>
                                           <div className="text-[10px] text-lime-400 font-bold uppercase print-text-black">{muscleGroup}</div>
                                           <div className="font-bold text-sm text-gray-100 print-text-black">{bestSet.exercise}</div>
                                       </div>
                                       <div className="text-right">
                                           <div className="font-black text-lg text-white print-text-black">{bestSet.estimated1RM} <span className="text-[10px] font-normal text-gray-400 print-text-black">kg (1RM)</span></div>
                                       </div>
                                   </div>
                               );
                           })}
                         </div>
                    </GlassCard>
                  </div>
              </PullToRefresh>
            );
          };

          return (
            <div className="min-h-screen font-sans selection:bg-lime-500/30 overflow-x-hidden pb-10">
              <Toast message={toast.message} type={toast.type} />
              
              <div className="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0 no-print">
                <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-900/20 rounded-full blur-[120px]"></div>
                <div className="absolute top-[40%] right-[-10%] w-[30%] h-[30%] bg-blue-900/10 rounded-full blur-[100px]"></div>
              </div>

              {/* PROFILE & COMMUNITY MODAL */}
              {isProfileModalOpen && (
                  <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                      <GlassCard className="w-full max-w-sm border-blue-500/50 shadow-[0_0_30px_rgba(59,130,246,0.2)]">
                          <div className="flex justify-between items-center mb-6">
                              <h3 className="font-bold text-white text-xl">Profil & Community</h3>
                              <button onClick={() => setIsProfileModalOpen(false)}><X className="text-gray-400 hover:text-white"/></button>
                          </div>

                          <div className="space-y-6">
                              <div>
                                  <h4 className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Pausen-Alarm Einstellungen</h4>
                                  <div className="bg-black/40 rounded-xl p-3 space-y-3">
                                      <label className="flex items-center justify-between cursor-pointer">
                                          <span className="text-sm flex items-center gap-2 text-white"><Bell className="w-4 h-4"/> Signalton (5 Sek)</span>
                                          <input type="checkbox" checked={userSettings.sound} onChange={(e) => saveUserSettings({ sound: e.target.checked })} />
                                      </label>
                                      <label className="flex items-center justify-between cursor-pointer">
                                          <span className="text-sm flex items-center gap-2 text-white"><Vibrate className="w-4 h-4"/> Vibration (nur Android)</span>
                                          <input type="checkbox" checked={userSettings.vibration} onChange={(e) => saveUserSettings({ vibration: e.target.checked })} />
                                      </label>
                                      <p className="text-[9px] text-gray-500">Apple blockiert Vibration im Web leider komplett.</p>
                                  </div>
                              </div>

                              <div>
                                  <h4 className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Privatsphäre</h4>
                                  <div className="bg-black/40 rounded-xl p-3 space-y-3 mb-6">
                                      <label className="flex items-center justify-between cursor-pointer">
                                          <span className="text-sm flex items-center gap-2 text-white"><EyeOff className="w-4 h-4"/> Profil verbergen</span>
                                          <input type="checkbox" checked={loggedInUser?.isPrivate || false} onChange={(e) => togglePrivacy(e.target.checked)} />
                                      </label>
                                      <p className="text-[9px] text-gray-500">Andere Nutzer können deine Trainingsdaten nicht mehr ansehen.</p>
                                  </div>
                              </div>

                              <div>
                                  <h4 className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Community ansehen</h4>
                                  <select value={viewingUser?.username} onChange={(e) => setViewingUser(appUsers.find(u => u.username === e.target.value))} className="w-full bg-black/40 text-white rounded-xl p-3 border border-white/20 outline-none text-sm font-bold uppercase">
                                      {appUsers.filter(u => !u.isPrivate || u.username === loggedInUser.username || loggedInUser.role === 'admin').map(u => (
                                          <option key={u.id} value={u.username}>{u.username} {u.username === loggedInUser.username ? '(Ich)' : ''}</option>
                                      ))}
                                  </select>
                              </div>

                              <button onClick={handleLogout} className="w-full flex justify-center items-center gap-2 text-red-500 hover:bg-red-500/10 p-3 rounded-xl font-bold transition">
                                  <LogOut className="w-4 h-4" /> Abmelden
                              </button>
                          </div>
                      </GlassCard>
                  </div>
              )}

              {/* CUSTOM EXERCISE MODAL */}
              {customExModal.isOpen && (
                  <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                      <GlassCard className="w-full max-w-sm border-lime-500/50 shadow-[0_0_30px_rgba(132,204,22,0.2)] relative animate-fade-in">
                          <div className="flex justify-between items-center mb-4">
                              <h3 className="font-bold text-white text-lg">Übungen für {customExModal.muscle}</h3>
                              <button onClick={() => setCustomExModal({ isOpen: false, muscle: '' })}><X className="text-gray-400 hover:text-white"/></button>
                          </div>
                          <div className="flex gap-2 mb-6">
                              <input type="text" placeholder="Neue Übung..." value={newCustomExName} onChange={e=>setNewCustomExName(e.target.value)} className="flex-1 bg-black/40 text-white rounded-lg p-3 border border-white/20 outline-none text-sm" />
                              <button onClick={handleAddCustomExercise} className="bg-lime-500 text-black px-4 rounded-lg font-bold hover:bg-lime-400 transition"><Plus className="w-5 h-5"/></button>
                          </div>
                          <div className="space-y-2 max-h-48 overflow-y-auto hide-scrollbar">
                              <h4 className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Deine eigenen Übungen</h4>
                              {!(customExercises[customExModal.muscle]?.length > 0) && <p className="text-xs text-gray-500">Noch keine eigenen Übungen angelegt.</p>}
                              {(customExercises[customExModal.muscle] || []).map(ex => (
                                  <div key={ex} className="flex justify-between items-center bg-white/5 p-2 rounded-lg border border-white/10">
                                      <span className="text-sm text-gray-200">{ex}</span>
                                      <button onClick={() => handleDeleteCustomExercise(ex)} className="text-red-500 hover:text-red-400 p-1"><Trash2 className="w-4 h-4"/></button>
                                  </div>
                              ))}
                          </div>
                      </GlassCard>
                  </div>
              )}

              <header className="sticky top-0 z-20 px-5 py-4 bg-[#050505]/40 backdrop-blur-3xl border-b border-white/10 no-print">
                <div className="flex items-center justify-between max-w-2xl mx-auto">
                  <div className="flex items-center gap-3">
                    <BrandLogo />
                    <div className="flex flex-col justify-center">
                        <h1 className="text-2xl font-black text-white tracking-tight leading-none mt-1">Lift<span className="text-lime-400">Pro</span></h1>
                        <span className="text-[13px] signature-font font-bold tracking-wide leading-none mt-1 block" style={{ background: 'linear-gradient(to right, #a3e635, #3b82f6)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Made by Ayoub</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                      {isRestTimerActive && <div className="flex items-center gap-1 text-amber-500 text-[10px] font-bold uppercase animate-pulse"><Clock className="w-3 h-3" /> <span className="hidden sm:inline">Pause</span></div>}
                      {isWorkoutActive && !isRestTimerActive && <div className="flex items-center gap-1 text-red-500 text-[10px] font-bold uppercase animate-pulse"><div className="w-2 h-2 bg-red-500 rounded-full"></div> <span className="hidden sm:inline">Live</span></div>}
                      
                      <button onClick={() => setIsProfileModalOpen(true)} className="flex items-center gap-2 bg-white/10 pl-2 pr-4 py-1.5 rounded-full border border-white/20 hover:bg-white/20 transition shadow-lg ml-2">
                          <div className={`w-2 h-2 rounded-full ${viewingUser?.username === loggedInUser.username ? 'bg-lime-500 shadow-[0_0_8px_#84cc16]' : 'bg-blue-500 shadow-[0_0_8px_#3b82f6]'}`}></div>
                          <span className="text-xs font-bold text-white uppercase tracking-wider">{viewingUser?.username}</span>
                      </button>
                  </div>
                </div>
              </header>

              <main className="p-5 max-w-2xl mx-auto relative z-10">
                {activeTab === 'eingabe' && renderTabEingabe()}
                {activeTab === 'heatmap' && renderTabHeatmap()}
                {activeTab === 'routinen' && renderTabRoutinen()}
                {activeTab === 'logbuch' && renderTabLogbuch()}
                {activeTab === 'stats' && renderTabStats()}
                {activeTab === 'admin' && renderTabAdmin()}
              </main>

              <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-[450px] z-50 no-print">
                <nav className="liquid-glass rounded-[2rem] flex justify-between items-center px-3 py-2">
                  <button onClick={() => setActiveTab('heatmap')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'heatmap' ? 'text-lime-400 bg-white/10' : 'text-gray-500 hover:text-gray-300'}`}><Activity className="w-5 h-5" /></button>
                  <button onClick={() => setActiveTab('routinen')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'routinen' ? 'text-lime-400 bg-white/10' : 'text-gray-500 hover:text-gray-300'}`}><Layers className="w-5 h-5" /></button>
                  <button onClick={() => setActiveTab('eingabe')} className="relative group mx-1">
                    <div className={`relative w-14 h-14 bg-lime-500 text-black rounded-full flex items-center justify-center shadow-[0_5px_20px_rgba(132,204,22,0.4)] transform transition-transform active:scale-95 border-2 border-[#050505] ${activeTab === 'eingabe' ? 'scale-110' : ''}`}><Plus className="w-6 h-6" /></div>
                  </button>
                  <button onClick={() => setActiveTab('logbuch')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'logbuch' ? 'text-lime-400 bg-white/10' : 'text-gray-500 hover:text-gray-300'}`}><CalendarIcon className="w-5 h-5" /></button>
                  <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'stats' ? 'text-lime-400 bg-white/10' : 'text-gray-500 hover:text-gray-300'}`}><BarChart2 className="w-5 h-5" /></button>
                  {loggedInUser.role === 'admin' && (
                      <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === 'admin' ? 'text-blue-400 bg-blue-500/20' : 'text-gray-500 hover:text-blue-300'}`}><Settings className="w-5 h-5" /></button>
                  )}
                </nav>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
